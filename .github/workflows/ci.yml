name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: lint · type-check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      # Pyright surfaces type information but the pandas/numpy stubs emit a known baseline of
      # false positives, so it is informational rather than a hard gate.
      - name: Pyright (informational)
        continue-on-error: true
        run: pyright

      - name: Pytest
        run: pytest -q
